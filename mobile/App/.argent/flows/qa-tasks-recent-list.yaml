steps:
  - echo: Restart the app signed out. Expect the Sign In screen (baseline)
  - launch: com.xemora.app
  - await: { visible: { text: Welcome Back }, timeout: 90000 }
  - await: { idle: true }
  - echo: On Sign In. Focus the email field and type the test account email
  - tap:
      text: Enter your email
  - tool: keyboard
    args:
      text: agent-test@xemora.local
  - echo: Email entered. Focus the password field and type the stored secret, then
      dismiss the keyboard
  - tap:
      text: "[password]"
  - tool: keyboard
    args:
      text: "{{secret:XEMORA_TEST_PASSWORD}}"
  - tool: keyboard
    args:
      key: enter
  - echo: Credentials entered. Tap Sign In; expect Home with recent chats
  - tap:
      text: Sign In
  - await: { visible: { text: Recent chats }, timeout: 20000 }
  - await: { idle: true }
  - echo: On Home. Open AI tasks; expect the recent task list with finished chat
      tasks
  - tap:
      id: home-tasks
  - await: { visible: { id: tasks-list }, timeout: 15000 }
  - await: { visible: { id: task-row, text: "Chat task, Done" }, timeout: 15000 }
  - await: { idle: true }
  - echo: Task list shown. Go back to Home, then sign out (restores the signed-out
      baseline)
  - tap:
      text: Go back
  - await: { visible: { text: Recent chats } }
  - await: { idle: true }
  - tap:
      id: tab-profile
  - await: { visible: { text: Sign Out } }
  - await: { idle: true }
  - tap:
      text: Sign Out
  - await: { visible: { text: Welcome Back } }
  - await: { idle: true }
